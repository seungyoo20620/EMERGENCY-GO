        let userMarker = null;

        // Haversine formula for distance calculation in KM
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in KM
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Update all hospital distance data based on current position
        function updateHospitalDistances() {
            currentHospitals.forEach(h => {
                const dist = calculateDistance(currentUserPos.lat, currentUserPos.lng, h.lat, h.lng);
                h.distance = parseFloat(dist.toFixed(1));
                // Estimate ETA: Average 35km/h in city traffic
                h.eta = Math.max(3, Math.round((h.distance / 35) * 60));
            });
            // Sort by nearest
            currentHospitals.sort((a, b) => a.distance - b.distance);
        }

        // Initialize Map
        function initMap() {
            leafletMap = L.map('map').setView([currentUserPos.lat, currentUserPos.lng], 13);

            // OpenStreetMap dark theme layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            }).addTo(leafletMap);

            updateUserMarkerOnMap();
            renderMarkers();
        }

        // Update user marker on Leaflet map
        function updateUserMarkerOnMap() {
            if (!leafletMap) return;

            if (userMarker) {
                leafletMap.removeLayer(userMarker);
            }

            const userIcon = L.divIcon({
                className: 'custom-user-icon',
                html: `
                    <div class="relative flex items-center justify-center">
                        <span class="animate-ping absolute inline-flex h-8 w-8 rounded-full bg-indigo-400 opacity-75"></span>
                        <div class="w-6 h-6 rounded-full bg-indigo-600 border-2 border-white flex items-center justify-center text-white text-[10px] shadow-lg">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                `,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            userMarker = L.marker([currentUserPos.lat, currentUserPos.lng], { icon: userIcon }).addTo(leafletMap);
            leafletMap.panTo([currentUserPos.lat, currentUserPos.lng]);
        }

        // Region Selection Change Logic
        function handleRegionChange() {
            const val = document.getElementById('region-select').value;
            const locTextEl = document.getElementById('current-location-text');
            const mapStatusEl = document.getElementById('map-status');

            if (val === 'current') {
                getCurrentGPSLocation(false);
            } else {
                const coord = regionCoordinates[val];
                if (coord) {
                    currentUserPos.lat = coord.lat;
                    currentUserPos.lng = coord.lng;

                    if (locTextEl) locTextEl.innerText = `선택 지역: ${coord.name}`;
                    if (mapStatusEl) mapStatusEl.innerText = `${coord.name} 중심 탐색 중`;

                    updateHospitalDistances();
                    updateUserMarkerOnMap();
                    renderCards();
                    renderMarkers();
                }
            }
        }

        // Render Cards
        function renderCards() {
            const container = document.getElementById('hospital-list');
            container.innerHTML = '';

            let filtered = currentHospitals.filter(h => {
                if (activeFilter === 'emergency') return h.emergency;
                if (activeFilter === 'night') return h.night;
                if (activeFilter === 'pediatric') return h.pediatric;
                return true; // 'all' or 'ai_rec'
            });

            const searchVal = document.getElementById('symptom-search').value.trim().toLowerCase();
            if (searchVal) {
                filtered = filtered.filter(h => 
                    h.name.toLowerCase().includes(searchVal) ||
                    h.symptoms.some(s => s.toLowerCase().includes(searchVal)) ||
                    h.departments.some(d => d.toLowerCase().includes(searchVal))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 rounded-2xl text-center space-y-3">
                        <i class="fa-solid fa-hospital-user text-4xl text-slate-600"></i>
                        <p class="text-sm text-slate-400">조건에 일치하는 병원이 존재하지 않습니다.</p>
                        <button onclick="resetSearch()" class="px-4 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-500 transition">
                            검색 조건 초기화
                        </button>
                    </div>
                `;
                return;
            }

            filtered.forEach(h => {
                const isSelected = activeSelectedHospital && activeSelectedHospital.id === h.id;
                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl transition cursor-pointer relative overflow-hidden ${isSelected ? 'ring-2 ring-indigo-500 bg-slate-900/90' : ''}`;
                card.onclick = () => selectHospital(h.id);

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${h.emergency ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-slate-800 text-slate-400'}">
                                    ${h.category}
                                </span>
                                ${h.pediatric ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">달빛어린이</span>' : ''}
                            </div>
                            <h4 class="font-bold text-sm sm:text-base text-slate-100">${h.name}</h4>
                            <p class="text-xs text-slate-400 flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-indigo-400 text-xs"></i>
                                ${h.address}
                            </p>
                        </div>

                        <!-- Distance & Bed Badge -->
                        <div class="text-right shrink-0">
                            <div class="text-base font-extrabold text-indigo-400">${h.distance} <span class="text-xs font-normal">km</span></div>
                            <div class="text-[11px] text-slate-400">차량 약 ${h.eta}분</div>
                        </div>
                    </div>

                    <!-- Symptoms & Tags -->
                    <div class="mt-3 flex flex-wrap gap-1.5">
                        ${h.departments.map(d => `<span class="text-[10px] px-2 py-0.5 rounded-lg bg-slate-900 text-slate-300 border border-slate-800">#${d}</span>`).join('')}
                    </div>

                    <!-- Action Buttons -->
                    <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <div class="flex items-center gap-3">
                            <a href="tel:${h.phone}" onclick="event.stopPropagation();" class="text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-phone"></i> ${h.phone}
                            </a>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="event.stopPropagation(); drawRoute(${h.id});" class="px-3 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 transition flex items-center gap-1">
                                <i class="fa-solid fa-route"></i> 길찾기
                            </button>
                            <button onclick="event.stopPropagation(); shareHospital('${h.name}', '${h.address}');" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Map Markers
        function renderMarkers() {
            if (!leafletMap) return;

            markersGroup.forEach(m => leafletMap.removeLayer(m));
            markersGroup = [];

            currentHospitals.forEach(h => {
                const markerIcon = L.divIcon({
                    className: 'custom-hospital-icon',
                    html: `
                        <div class="w-7 h-7 rounded-full ${h.emergency ? 'bg-rose-600' : 'bg-indigo-600'} border-2 border-white flex items-center justify-center text-white text-xs shadow-md">
                            <i class="fa-solid ${h.emergency ? 'fa-truck-medical' : 'fa-hospital'}"></i>
                        </div>
                    `,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const m = L.marker([h.lat, h.lng], { icon: markerIcon }).addTo(leafletMap);
                m.bindPopup(`
                    <div class="p-1 text-slate-900">
                        <strong class="text-xs font-bold">${h.name}</strong><br/>
                        <span class="text-[11px] text-slate-600">${h.phone}</span><br/>
                        <span class="text-[11px] font-semibold text-indigo-600">거리: ${h.distance}km (${h.eta}분)</span>
                    </div>
                `);
                m.on('click', () => selectHospital(h.id));
                markersGroup.push(m);
            });
        }

        // Select Hospital Card
        function selectHospital(id) {
            activeSelectedHospital = currentHospitals.find(h => h.id === id);
            if (activeSelectedHospital && leafletMap) {
                leafletMap.panTo([activeSelectedHospital.lat, activeSelectedHospital.lng]);
                leafletMap.setZoom(15);
            }
            renderCards();
        }

        // Draw Route (Polyline)
        function drawRoute(id) {
            const h = currentHospitals.find(item => item.id === id);
            if (!h || !leafletMap) return;

            if (routePolyline) leafletMap.removeLayer(routePolyline);

            const latlngs = [
                [currentUserPos.lat, currentUserPos.lng],
                [h.lat, h.lng]
            ];

            routePolyline = L.polyline(latlngs, { color: '#6366f1', weight: 4, dashArray: '6, 8' }).addTo(leafletMap);
            leafletMap.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });

            const mapStatusEl = document.getElementById('map-status');
            if (mapStatusEl) mapStatusEl.innerText = `${h.name} 경로 표시 중`;
        }

        // GPS Location Fetching
        function getCurrentGPSLocation(showAlert = false) {
            const locTextEl = document.getElementById('current-location-text');
            const mapStatusEl = document.getElementById('map-status');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentUserPos.lat = position.coords.latitude;
                        currentUserPos.lng = position.coords.longitude;

                        if (locTextEl) {
                            locTextEl.innerText = `내 위치 (GPS 정확도 보정됨)`;
                        }
                        if (mapStatusEl) mapStatusEl.innerText = "GPS 위치 동기화 완료";

                        const regionSelect = document.getElementById('region-select');
                        if (regionSelect) regionSelect.value = 'current';

                        updateHospitalDistances();
                        updateUserMarkerOnMap();
                        renderCards();
                        renderMarkers();

                        if (showAlert) showToast("현재 GPS 위치가 성공적으로 갱신되었습니다.");
                    },
                    (error) => {
                        if (showAlert) showToast("GPS 권한을 허용할 수 없어 기본 위치(서울시청)로 설정됩니다.");
                    }
                );
            }
        }

        // Filter Handlers
        function setFilter(filterType) {
            activeFilter = filterType;
            updateTabStyles();
            renderCards();
        }

        function updateTabStyles() {
            const tabs = ['all', 'ai', 'emergency', 'night', 'pediatric'];
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (el) {
                    el.className = "px-3.5 py-2 rounded-xl font-medium bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-white transition shrink-0 flex items-center gap-1.5 text-xs";
                }
            });

            const activeEl = document.getElementById(`tab-${activeFilter === 'ai_rec' ? 'ai' : activeFilter}`);
            if (activeEl) {
                activeEl.className = "px-3.5 py-2 rounded-xl font-medium bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 transition shrink-0 flex items-center gap-1.5 text-xs";
            }
        }

        function filterHospitals() {
            renderCards();
        }

        function quickSearch(keyword) {
            document.getElementById('symptom-search').value = keyword;
            renderCards();
        }

        function resetSearch() {
            document.getElementById('symptom-search').value = '';
            const regionSelect = document.getElementById('region-select');
            if (regionSelect) regionSelect.value = 'current';
            activeFilter = 'ai_rec';
            updateTabStyles();
            getCurrentGPSLocation(false);
        }

        // Voice Search Trigger
        function triggerVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ko-KR';

                const micBtn = document.getElementById('mic-btn');
                micBtn.classList.add('bg-rose-600', 'text-white', 'animate-pulse');

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('symptom-search').value = text;
                    renderCards();
                    micBtn.classList.remove('bg-rose-600', 'text-white', 'animate-pulse');
                    showToast(`음성 인식 결과: "${text}"`);
                };

                recognition.onerror = () => {
                    micBtn.classList.remove('bg-rose-600', 'text-white', 'animate-pulse');
                    showToast("음성 인식이 취소되었거나 오류가 발생했습니다.");
                };

                recognition.start();
            } else {
                showToast("사용 중인 브라우저가 음성 인식을 지원하지 않습니다.");
            }
        }

        // Share Function
        function shareHospital(name, address) {
            const shareText = `[응급케어24] ${name}\n주소: ${address}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText);
                showToast("병원 정보가 클립보드에 복사되었습니다.");
            } else {
                showToast("복사 기능을 지원하지 않는 환경입니다.");
            }
        }

        // UI Toast Message Helper
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium transition duration-300 opacity-0 transform translate-y-2';
            toast.innerText = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 50);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Application Onload Initialize
        window.onload = function() {
            updateHospitalDistances();
            initMap();
            renderCards();
            getCurrentGPSLocation(false);
        };
    </script>
</body>
</html>
